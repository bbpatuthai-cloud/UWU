<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UWU Cafe Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#fff7fb;color:#4b3842}
.app{min-height:100vh}.main{width:100%;padding:0 28px 40px}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;min-height:154px;padding:18px 24px 14px;background:rgba(255,247,251,.96);backdrop-filter:blur(12px);border-bottom:1px solid #f2dce6;box-shadow:0 8px 25px rgba(214,95,145,.08)}.brand-center{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:1180px}.logo{text-align:center;font-size:28px;font-weight:800;color:#e88bb2}.logo span{font-size:13px;display:block;color:#9c7c8b;font-weight:400;margin-top:2px}.top-menu{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.top-menu button{border:1px solid #f0d3e0;background:#fff;border-radius:18px;padding:10px 14px;font-size:14px;color:#67515c;cursor:pointer;box-shadow:0 4px 12px rgba(214,95,145,.06);transition:.18s}.top-menu button:hover,.top-menu button.active{background:#ffe3ef;border-color:#f4bdd4;color:#d65f91;font-weight:700}.cute-decoration{position:absolute;top:24px;font-size:24px;letter-spacing:5px;opacity:.9}.cute-decoration.left{left:28px}.cute-decoration.right{right:28px}.page-heading{display:flex;justify-content:space-between;align-items:center;max-width:1320px;margin:28px auto 25px}.page-heading h1{margin:0;font-size:28px}.badge{background:#ffe5f0;padding:8px 14px;border-radius:20px;color:#d65f91}
.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid #f2dce6;border-radius:20px;padding:20px;box-shadow:0 5px 20px #e8b9cc22}.value{font-size:28px;font-weight:800;margin-top:8px}
.panel{background:white;border:1px solid #f2dce6;border-radius:20px;padding:20px;margin-top:20px}.panel h2{margin-top:0;font-size:19px}.btn{border:0;background:#e98bb3;color:white;padding:10px 15px;border-radius:12px;cursor:pointer;font-weight:700}.btn.secondary{background:#ffe5f0;color:#c85e88}.btn.danger{background:#f28b9e}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #f2e4ea}th{color:#9a7d89;font-size:13px}.status{padding:5px 10px;border-radius:15px;font-size:12px;background:#ffe9f1;color:#d45d8c}
.status.green{background:#e8f8ef;color:#45946b}.status.yellow{background:#fff4d9;color:#a9781d}.status.gray{background:#eee;color:#777}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.online-mode {background: #e8f8ef; color: #2e7d32; padding: 5px 15px; border-radius: 20px; font-size: 12px; margin-left: 10px; font-weight: bold; display: inline-block;}
</style>
</head>
<body>
<div class="app">
<main class="main">
<header class="topbar">
  <div class="cute-decoration left">🌸 🐾</div>
  <div class="brand-center">
    <div class="logo">🐱 UWU Cafe<span>Manager System <span id="onlineIndicator" class="online-mode">🟢 โหมดออนไลน์</span></span></div>
    <div class="top-menu">
      <button class="active" onclick="showPage('dashboard',this)">🏠 Dashboard</button>
      <button onclick="showPage('orders',this)">🧾 จัดการออเดอร์</button>
      <button onclick="showPage('menus',this)">🍰 จัดการเมนู</button>
      <button onclick="showPage('tables',this)">🪑 จัดการโต๊ะ</button>
    </div>
  </div>
  <div class="cute-decoration right">🐾 💕</div>
</header>
<div class="page-heading"><h1 id="pageTitle">Dashboard</h1><div class="badge">♡ UWU Cafe</div></div>

<section id="dashboard" class="page active">
 <div class="panel">
  <h2>🧾 ออเดอร์ล่าสุด</h2>
  <table><thead><tr><th>เลขที่ออเดอร์</th><th>โต๊ะ</th><th>รายการ</th><th>ยอดรวม</th><th>สถานะ</th></tr></thead><tbody id="dashOrders"></tbody></table>
 </div>
</section>

<section id="orders" class="page">
 <div class="panel"><h2>จัดการออเดอร์</h2></div>
</section>

<section id="menus" class="page">
 <div class="panel"><h2>จัดการเมนู</h2></div>
</section>

<section id="tables" class="page">
 <div class="panel"><h2>จัดการโต๊ะ</h2></div>
</section>
</main>
</div>

<script>
window.SUPABASE_CONFIG = {
  url: "https://vehsmnstxrdzcrsrsgzr.supabase.co",
  publishableKey: "sb_publishable_1ddU0deXdUTJCOOz6F52Ug_3xYtUNhP"
};

let sb = null;
try {
  if (typeof supabase !== 'undefined') {
    sb = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.publishableKey);
  }
} catch(e) { console.error("Supabase Init Error:", e); }

function showPage(id, btn) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".top-menu button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}
</script>
</body>
</html>
