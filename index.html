<script>
// ==========================================
// ฐานข้อมูล Supabase Online Realtime 
// ==========================================
window.SUPABASE_CONFIG = {
  url: "https://vehsmnstxrdzcrsrsgzr.supabase.co",
  publishableKey: "sb_publishable_1ddU0deXdUTJCOOz6F52Ug_3xYtUNhP"
};

let sb = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.publishableKey);

// 1. Postgres Database Realtime Sync
sb.channel('db-changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'uwu_tables' }, () => refreshAll())
  .on('postgres_changes', { event: '*', schema: 'public', table: 'uwu_menus' }, () => refreshAll())
  .on('postgres_changes', { event: '*', schema: 'public', table: 'uwu_orders' }, () => refreshAll())
  .subscribe();

// 2. Direct Web Realtime Broadcast (ซิงค์ตรงทันทีแม้ DB ไม่ส่ง Realtime)
const globalBroadcast = sb.channel('uwu_global_sync');
globalBroadcast.on('broadcast', { event: 'data_changed' }, () => {
  refreshAll();
}).subscribe();

function triggerGlobalSync() {
  globalBroadcast.send({
    type: 'broadcast',
    event: 'data_changed',
    payload: { timestamp: Date.now() }
  });
}

// Backup Sync
const syncChannel = new BroadcastChannel('uwu_cafe_realtime_sync');
syncChannel.onmessage = () => refreshAll();

function notifyRealtimeChange() {
  triggerGlobalSync();
  syncChannel.postMessage({ timestamp: Date.now() });
}

// Data Arrays
let tables = [], menus = [], orders = [], staff = [], completedOrders = [];

// DB API Functions
async function dbGet(table) {
  try {
    let { data, error } = await sb.from(table).select('*').order('id');
    if (!error && data) return data;
  } catch(e) {}
  return JSON.parse(localStorage.getItem(table) || '[]');
}

async function dbInsert(table, row) {
  try {
    let { data, error } = await sb.from(table).insert(row).select().single();
    if (!error && data) {
      notifyRealtimeChange();
      await refreshAll();
      return data;
    }
  } catch(e) {}
  
  let arr = await dbGet(table);
  row.id = Date.now();
  arr.push(row);
  localStorage.setItem(table, JSON.stringify(arr));
  notifyRealtimeChange();
  await refreshAll();
  return row;
}

async function dbUpdate(table, id, row) {
  try {
    let { error } = await sb.from(table).update(row).eq('id', id);
    if (!error) {
      notifyRealtimeChange();
      await refreshAll();
      return true;
    }
  } catch(e) {}

  let arr = await dbGet(table);
  arr = arr.map(x => x.id === id ? { ...x, ...row } : x);
  localStorage.setItem(table, JSON.stringify(arr));
  notifyRealtimeChange();
  await refreshAll();
  return true;
}

async function dbDelete(table, id) {
  try {
    let { error } = await sb.from(table).delete().eq('id', id);
    if (!error) {
      notifyRealtimeChange();
      await refreshAll();
      return true;
    }
  } catch(e) {}

  let arr = await dbGet(table);
  arr = arr.filter(x => x.id !== id);
  localStorage.setItem(table, JSON.stringify(arr));
  notifyRealtimeChange();
  await refreshAll();
  return true;
}

// Fetch & Render Data
async function refreshAll() {
  const rawTables = await dbGet('uwu_tables');
  const rawMenus = await dbGet('uwu_menus');
  const rawOrders = await dbGet('uwu_orders');

  // Map Tables
  tables = rawTables.map(t => {
    let hasOrder = rawOrders.find(o => String(o.table_id) === String(t.id) && (o.status === 'กำลังทำ' || o.status === 'พร้อมเสิร์ฟ' || o.status === 'รออาหาร'));
    return {
      dbId: t.id,
      id: t.name || ("T" + t.id),
      status: hasOrder ? "มีลูกค้า" : "ว่าง"
    };
  });

  // Map Menus
  menus = rawMenus.map(m => {
    let extra = { cat: 'ขนมหวาน', icon: '🍰', image: '' };
    try { if (m.description && m.description.startsWith('{')) extra = JSON.parse(m.description); } catch(e){}
    return {
      dbId: m.id,
      name: m.name,
      price: m.price,
      cat: extra.cat || 'ขนมหวาน',
      icon: extra.icon || '🍰',
      image: extra.image || ''
    };
  });

  // Map Orders & Staff
  orders = [];
  completedOrders = [];
  let foundStaff = false;

  rawOrders.forEach(o => {
    if (o.status === 'UWU_STAFF') {
      try { staff = JSON.parse(o.items || '[]'); foundStaff = true; } catch(e){}
      return;
    }

    let itemsArr = [];
    try { itemsArr = JSON.parse(o.items || '[]'); } catch(e){}
    
    let itemsText = itemsArr.map(it => `${it.name} ×${it.qty}`).join(', ');
    
    let tableObj = tables.find(t => String(t.dbId) === String(o.table_id));
    let tableName = tableObj ? tableObj.id : (o.table_id ? 'โต๊ะ '+o.table_id : 'กลับบ้าน');

    let mappedOrder = {
      dbId: o.id,
      id: "#" + String(o.id).slice(-3),
      tableId: o.table_id,
      table: tableName,
      items: itemsText,
      total: o.total,
      status: o.status === 'รออาหาร' ? 'กำลังทำ' : o.status,
      date: o.created_at ? new Date(o.created_at).toISOString().slice(0,10) : todayISO()
    };

    if (mappedOrder.status === 'เสร็จแล้ว' || mappedOrder.status === 'จบงาน') {
      mappedOrder.status = 'เสร็จแล้ว';
      completedOrders.unshift(mappedOrder);
    } else {
      orders.unshift(mappedOrder);
    }
  });

  if (!foundStaff && staff.length === 0) {
    staff = [
      { name: "Mimi", role: "ผู้จัดการ", status: "กำลังทำงาน", attendance: "เข้าเวร", attendanceTime: "-" },
      { name: "Mochi", role: "พนักงานเสิร์ฟ", status: "กำลังทำงาน", attendance: "เข้าเวร", attendanceTime: "-" }
    ];
  }

  renderOrders();
  renderMenus();
  renderTables();
  renderStaff();
  renderManagerData();
  updateDash();
}

window.onload = refreshAll;

// Auto Refresh สำรองทุกๆ 5 วินาที
setInterval(refreshAll, 5000);

// ==========================================
// UI & Interaction
// ==========================================
function todayISO(){return new Date().toISOString().slice(0,10)}
function formatDate(date){ const d=new Date(date+"T00:00:00"); return d.toLocaleDateString("th-TH",{day:"2-digit",month:"2-digit",year:"numeric"}); }

const titles={dashboard:"Dashboard",orders:"จัดการออเดอร์",menus:"จัดการเมนู",tables:"จัดการโต๊ะ",staff:"จัดการพนักงาน",manager:"ผู้จัดการ"};
function showPage(id,btn){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".top-menu button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");document.getElementById("pageTitle").textContent=titles[id];}
function statusClass(s){return s==="เสร็จแล้ว"?"green":s==="กำลังทำ"?"yellow":s==="มีลูกค้า"?"yellow":s==="ว่าง"?"green":s==="พัก"?"gray":""}

function renderOrders(){
  let h=orders.map((o,i)=>`<tr><td>${o.id}</td><td>${o.table}</td><td>${o.items}</td><td>฿${o.total}</td><td>
  <select class="status-select" onchange="changeStatus(${i}, this.value)">
  <option value="กำลังทำ" ${o.status==="กำลังทำ"?"selected":""}>กำลังทำ</option>
  <option value="พร้อมเสิร์ฟ" ${o.status==="พร้อมเสิร์ฟ"?"selected":""}>พร้อมเสิร์ฟ</option>
  <option value="เสร็จแล้ว" ${o.status==="เสร็จแล้ว"?"selected":""}>เสร็จแล้ว</option>
  <option value="ยกเลิก" ${o.status==="ยกเลิก"?"selected":""}>ยกเลิก</option>
  </select></td>
  <td><button class="btn danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteOrder(${o.dbId})">ลบ</button></td>
  </tr>`).join("");
  document.getElementById("ordersTable").innerHTML=h;
  document.getElementById("dashOrders").innerHTML=orders.slice(0,5).map(o=>`<tr><td>${formatDate(o.date)}</td><td>${o.id}</td><td>${o.table}</td><td>${o.items}</td><td>฿${o.total}</td><td><span class="status ${statusClass(o.status)}">${o.status}</span></td></tr>`).join("");
}

async function changeStatus(i, value){
  const o = orders[i];
  if(value === "เสร็จแล้ว"){
    await dbUpdate('uwu_orders', o.dbId, { status: "จบงาน" });
  } else if (value === "ยกเลิก") {
    if(confirm("ต้องการยกเลิกและลบออเดอร์นี้ใช่ไหม?")) {
      await dbDelete('uwu_orders', o.dbId);
    } else {
      renderOrders();
      return;
    }
  } else {
    await dbUpdate('uwu_orders', o.dbId, { status: value });
  }
}

async function deleteOrder(dbId){
  if(confirm("ต้องการลบออเดอร์นี้ใช่ไหม 🐱?")) {
    await dbDelete('uwu_orders', dbId);
  }
}

// ออเดอร์
let currentOrderItems=[];
let currentOrderQty=1;
function populateOrderMenu(){
  document.getElementById("orderMenu").innerHTML=menus.map((m,i)=>`<option value="${i}">${m.icon} ${m.name} · ฿${m.price}</option>`).join("");
}
function renderSelectedOrderItems(){
  if(!currentOrderItems.length){
    document.getElementById("selectedOrderItems").innerHTML='<div class="empty-order">ยังไม่มีเมนูที่เลือก เหมียว~</div>';
  }else{
    document.getElementById("selectedOrderItems").innerHTML=currentOrderItems.map((item,i)=>`<div class="selected-order-item"><div class="item-info"><b>${item.icon} ${item.name}</b><br><small>฿${item.price} × ${item.qty}</small></div><strong>฿${item.price*item.qty}</strong><button class="remove-item" onclick="removeOrderItem(${i})">✕</button></div>`).join("");
  }
  const total=currentOrderItems.reduce((s,item)=>s+item.price*item.qty,0);
  document.getElementById("orderTotal").textContent="฿"+total.toLocaleString("th-TH");
}
function newOrder(){
  currentOrderItems=[]; currentOrderQty=1; document.getElementById("orderQty").textContent="1";
  
  const tableSelect = document.getElementById("orderTable");
  if(!tables.length) { alert("ผู้จัดการยังไม่ได้เพิ่มโต๊ะเลยนะเหมียว 🐱"); return; }
  tableSelect.innerHTML = tables.map(t => `<option value="${t.dbId}">🪑 ${t.id} ${t.status==="มีลูกค้า"?"(มีลูกค้า)":""}</option>`).join('');
  
  populateOrderMenu(); renderSelectedOrderItems(); document.getElementById("orderModal").classList.add("show");
}
function closeOrderModal(){document.getElementById("orderModal").classList.remove("show")}
function changeOrderQty(delta){currentOrderQty=Math.max(1,currentOrderQty+delta);document.getElementById("orderQty").textContent=currentOrderQty}
function addOrderItem(){
  if(!menus.length)return alert("ยังไม่มีเมนูในร้านเหมียว 🐱");
  const m=menus[Number(document.getElementById("orderMenu").value)];
  const found=currentOrderItems.find(x=>x.name===m.name);
  if(found) found.qty+=currentOrderQty;
  else currentOrderItems.push({...m,qty:currentOrderQty});
  currentOrderQty=1; document.getElementById("orderQty").textContent="1";
  renderSelectedOrderItems();
}
function removeOrderItem(i){currentOrderItems.splice(i,1);renderSelectedOrderItems()}

async function confirmNewOrder(){
  const tId = document.getElementById("orderTable").value;
  if(!tId)return;
  if(!currentOrderItems.length){alert("เลือกเมนูก่อนนะเหมียว 🐱");return;}
  
  const total = currentOrderItems.reduce((s,item)=>s+item.price*item.qty,0);
  
  const itemsFormatForDb = currentOrderItems.map(it => ({
    menu_id: it.dbId, name: it.name, price: it.price, qty: it.qty
  }));

  const row = {
    table_id: Number(tId),
    items: JSON.stringify(itemsFormatForDb),
    total: total,
    status: 'กำลังทำ',
    created_at: new Date().toISOString()
  };

  await dbInsert('uwu_orders', row);
  closeOrderModal();
}

// เมนู
function renderMenus(){
  document.getElementById("menuGrid").innerHTML=menus.map((m,i)=>`<div class="menu-item"><div class="menu-img">${m.image?`<img src="${m.image}" alt="${m.name}" onerror="this.style.display='none';this.parentElement.innerHTML='${m.icon}'">`:m.icon}</div><b>${m.name}</b><p><span class="price">฿${m.price}</span> · ${m.cat}</p><div class="actions"><button class="btn secondary" onclick="editMenu(${i})">แก้ไข</button><button class="btn danger" onclick="deleteMenu(${m.dbId})">ลบ</button></div></div>`).join("");
}
function previewMenuImage(){
  const url=document.getElementById("menuImage").value.trim();
  document.getElementById("menuImagePreview").innerHTML=url?`<img src="${url}" alt="ตัวอย่างรูป" onerror="this.style.display='none';this.parentElement.innerHTML='<span>⚠️</span><small>URL รูปนี้ใช้ไม่ได้</small>'">`:'<span>🐱</span><small>ใส่ URL รูปเพื่อดูตัวอย่าง</small>';
}
let editingMenuDbId = -1;
function resetMenuPreview(){document.getElementById("menuImagePreview").innerHTML='<span>🐱</span><small>ใส่ URL รูปเพื่อดูตัวอย่าง</small>'}
function openMenuModal(){
  editingMenuDbId = -1;
  document.getElementById("menuModalTitle").textContent="เพิ่มเมนู";
  document.getElementById("menuName").value="";
  document.getElementById("menuPrice").value="";
  document.getElementById("menuCat").value="ขนมหวาน";
  document.getElementById("menuImage").value="";
  resetMenuPreview();
  document.getElementById("menuModal").classList.add("show");
  setTimeout(()=>document.getElementById("menuName").focus(),100);
}
function closeMenuModal(){document.getElementById("menuModal").classList.remove("show"); editingMenuDbId=-1;}

function editMenu(i){
  const m=menus[i];
  editingMenuDbId = m.dbId;
  document.getElementById("menuModalTitle").textContent="แก้ไขเมนู";
  document.getElementById("menuName").value=m.name;
  document.getElementById("menuPrice").value=m.price;
  document.getElementById("menuCat").value=m.cat;
  document.getElementById("menuImage").value=m.image||"";
  previewMenuImage();
  document.getElementById("menuModal").classList.add("show");
  setTimeout(()=>document.getElementById("menuName").focus(),100);
}

async function saveMenu(){
  let n=document.getElementById("menuName").value.trim(), 
      p=Number(document.getElementById("menuPrice").value), 
      c=document.getElementById("menuCat").value, 
      img=document.getElementById("menuImage").value.trim();
      
  if(!n||!p)return alert("กรอกชื่อเมนูและราคาให้ครบ 🐱");
  
  let extraDesc = JSON.stringify({ cat: c, icon: c==="เครื่องดื่ม"?"🧋":"🍰", image: img });
  
  if (editingMenuDbId !== -1) {
    await dbUpdate('uwu_menus', editingMenuDbId, { name: n, price: p, description: extraDesc });
  } else {
    await dbInsert('uwu_menus', { name: n, price: p, description: extraDesc });
  }
  closeMenuModal();
}

async function deleteMenu(dbId){
  if(confirm("ลบเมนูนี้ใช่ไหม?")){
    await dbDelete('uwu_menus', dbId);
  }
}

// โต๊ะ
function renderTables(){
  document.getElementById("tableGrid").innerHTML=tables.map((t)=>`<div class="card"><div style="font-size:40px">🪑</div><h2>${t.id}</h2><span class="status ${statusClass(t.status)}">${t.status}</span><div class="actions" style="margin-top:15px"><button class="btn danger" onclick="deleteTable(${t.dbId})" ${t.status==="มีลูกค้า"?"disabled":""}>ลบ</button></div></div>`).join("");
  updateDash();
}
async function addTable(){
  let newName = "T" + String(tables.length+1).padStart(2,"0");
  await dbInsert('uwu_tables', { name: newName });
}
async function deleteTable(dbId){
  if(confirm("ต้องการลบโต๊ะนี้ทิ้งใช่ไหม?")){
    await dbDelete('uwu_tables', dbId);
  }
}

// พนักงาน
function renderStaff(){
  const e=document.getElementById("staffTable");
  e.innerHTML=staff.map((s,i)=>`<tr><td>${s.name}</td><td>${s.role}</td><td><select class="status-select" onchange="changeStaffStatus(${i},this.value)"><option value="กำลังทำงาน" ${s.status==="กำลังทำงาน"?"selected":""}>🟢 กำลังทำงาน</option><option value="พัก" ${s.status==="พัก"?"selected":""}>🟡 พัก</option><option value="ลา" ${s.status==="ลา"?"selected":""}>🔴 ลา</option></select></td><td><select class="status-select" onchange="changeAttendance(${i},this.value)"><option value="ยังไม่เข้าเวร" ${(!s.attendance||s.attendance==="ยังไม่เข้าเวร")?"selected":""}>⚪ ยังไม่เข้าเวร</option><option value="เข้าเวร" ${s.attendance==="เข้าเวร"?"selected":""}>🟢 เข้าเวร</option><option value="ออกเวร" ${s.attendance==="ออกเวร"?"selected":""}>🔵 ออกเวร</option><option value="ลา" ${s.attendance==="ลา"?"selected":""}>🔴 ลา</option></select><div class="shift-time">${s.attendanceTime||"-"}</div></td><td class="staff-row-actions"><button class="btn edit-staff-btn" onclick="openStaffModal(${i})">แก้ไข</button><button class="btn danger" onclick="removeStaff(${i})">ลบ</button></td></tr>`).join("");
}

async function syncStaffToDb() {
  const staffLogs = await dbGet('uwu_orders');
  const staffRow = staffLogs.find(o => o.status === 'UWU_STAFF');
  
  if (staffRow) {
    await dbUpdate('uwu_orders', staffRow.id, { items: JSON.stringify(staff) });
  } else {
    await dbInsert('uwu_orders', { table_id: null, items: JSON.stringify(staff), total: 0, status: 'UWU_STAFF' });
  }
}

function changeStaffStatus(i,status){staff[i].status=status; renderStaff(); syncStaffToDb();}
function changeAttendance(i,status){
  staff[i].attendance=status; 
  staff[i].attendanceTime = new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}); 
  renderStaff(); syncStaffToDb();
}
function removeStaff(i){if(confirm("ลบพนักงานคนนี้ใช่ไหม?")){staff.splice(i,1); renderStaff(); syncStaffToDb();}}

let editingStaffIndex=-1;
function openStaffModal(index=-1){
  editingStaffIndex=index;
  document.getElementById("staffModalTitle").textContent=index<0?"เพิ่มพนักงานใหม่":"แก้ไขข้อมูลพนักงาน";
  const s=index<0?{name:"",role:"พนักงานเสิร์ฟ",status:"กำลังทำงาน",attendance:"ยังไม่เข้าเวร"}:staff[index];
  document.getElementById("staffName").value=s.name;
  document.getElementById("staffRole").value=s.role;
  document.getElementById("staffStatus").value=s.status;
  document.getElementById("staffAttendance").value=s.attendance||"ยังไม่เข้าเวร";
  document.getElementById("staffModal").classList.add("show");
  setTimeout(()=>document.getElementById("staffName").focus(),80);
}
function closeStaffModal(){document.getElementById("staffModal").classList.remove("show");editingStaffIndex=-1}

async function saveStaff(){
  const name=document.getElementById("staffName").value.trim();
  if(!name){alert("กรุณาใส่ชื่อพนักงานนะ 🐱");return}
  const data={name,role:document.getElementById("staffRole").value,status:document.getElementById("staffStatus").value,attendance:document.getElementById("staffAttendance").value,attendanceTime:(editingStaffIndex>=0?staff[editingStaffIndex].attendanceTime:"-")};
  if(editingStaffIndex<0) staff.push(data); else staff[editingStaffIndex]=data;
  
  await syncStaffToDb();
  renderStaff(); closeStaffModal();
}

// โหมดผู้จัดการ
const MANAGER_PASSWORD="1208";
let managerLoginButton=null;
let managerUnlocked=false;

function openManagerLogin(btn){
  managerLoginButton=btn;
  if(managerUnlocked){showPage("manager",btn);return}
  document.getElementById("managerPassword").value="";
  document.getElementById("managerLoginModal").classList.add("show");
  setTimeout(()=>document.getElementById("managerPassword").focus(),80);
}
function closeManagerLogin(){document.getElementById("managerLoginModal").classList.remove("show")}
function verifyManagerPassword(){
  const input=document.getElementById("managerPassword").value;
  if(input===MANAGER_PASSWORD){
    managerUnlocked=true;
    closeManagerLogin();
    showPage("manager",managerLoginButton);
  }else{
    alert("รหัสผู้จัดการไม่ถูกต้องนะเหมียว 🐱");
    document.getElementById("managerPassword").select();
  }
}

function renderManagerData(){
  const total=completedOrders.reduce((sum,o)=>sum+Number(o.total||0),0);
  document.getElementById("completedSales").textContent="฿"+total.toLocaleString("th-TH");
  document.getElementById("completedCount").textContent=completedOrders.length;
  document.getElementById("pendingCount").textContent=orders.length;
  
  document.getElementById("completedOrdersTable").innerHTML=completedOrders.map(o=>`<tr><td>${formatDate(o.date||todayISO())}</td><td>${o.id}</td><td>${o.table}</td><td>${o.items}</td><td>฿${Number(o.total).toLocaleString("th-TH")}</td><td><span class="status green">เสร็จแล้ว</span></td></tr>`).join("");
}

function updateDash(){
  const todayStr = todayISO();
  const todayOrders = completedOrders.filter(o => o.date === todayStr);
  const todaySales = todayOrders.reduce((sum, o) => sum + Number(o.total || 0), 0);
  
  document.getElementById("sales").textContent = "฿" + todaySales.toLocaleString("th-TH");
  document.getElementById("orderCount").textContent = (todayOrders.length + orders.length);
  document.getElementById("freeTables").textContent = tables.filter(t => t.status==="ว่าง").length;
}
</script>
